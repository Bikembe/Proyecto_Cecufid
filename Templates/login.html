<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - CECUFID</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0d47a1, #1565c0);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .login-header {
            background-color: #0d47a1;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .login-header h2 {
            margin: 0;
            font-size: 22px;
        }

        .login-header small {
            display: block;
            margin-top: 5px;
            font-size: 12px;
            opacity: 0.9;
        }

        .login-body {
            padding: 25px;
        }

        label {
            font-weight: bold;
            font-size: 14px;
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            transition: 0.2s;
            box-sizing: border-box;
        }

        input:focus {
            border-color: #1565c0;
            box-shadow: 0 0 5px rgba(21,101,192,0.3);
        }

        .btn {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background-color: #1565c0;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            background-color: #0d47a1;
        }

        .footer-text {
            text-align: center;
            font-size: 12px;
            color: #666;
            padding: 15px;
            background: #f4f6f9;
        }

        .error {
            background-color: #ffcdd2;
            color: #b71c1c;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 13px;
        }

        /* ========================= */
        /* 📱 RESPONSIVE */
        /* ========================= */

        @media (max-width: 480px) {

            .login-container {
                border-radius: 10px;
            }

            .login-body {
                padding: 18px;
            }

            .login-header h2 {
                font-size: 18px;
            }

            input {
                font-size: 14px;
                padding: 12px;
            }

            .btn {
                padding: 14px;
                font-size: 15px;
            }
        }

    </style>
</head>

<body>

<div class="login-container">

    <div class="login-header">
        <h2>CECUFID Morelia</h2>
        <small>Sistema de Control de Albercas</small>
    </div>

    <div class="login-body">

        {% if form.errors %}
            <div class="error">
                Usuario o contraseña incorrectos
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label>Usuario</label>
            {{ form.username }}

            <label>Contraseña</label>
            {{ form.password }}

            <button type="submit" class="btn">Iniciar Sesión</button>
        </form>

    </div>

    <div class="footer-text">
        Gobierno del Estado de Michoacán • CECUFID
    </div>

</div>

</body>
</html>
