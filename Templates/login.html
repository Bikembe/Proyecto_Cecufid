<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CECUFID</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;

            /* 🎯 FONDO INSTITUCIONAL */
            background: url("/static/img/fondo.jpg") no-repeat center center fixed;
            background-size: cover;

            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;

            position: relative;
        }

        .login-container {
            width: 100%;
            max-width: 420px;

            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            overflow: hidden;

            position: relative;
            z-index: 1;
        }

        .login-header {
            background-color: #0d47a1;
            color: white;
            padding: 14px 15px;
            text-align: center;
        }

        .login-header h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }

        .login-header small {
            font-size: 11px;
            opacity: 0.9;
        }

        .login-body {
            padding: 25px;
        }

        label {
            font-weight: bold;
            font-size: 14px;
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            transition: 0.2s;
            box-sizing: border-box;
        }

        input:focus {
            border-color: #1565c0;
            box-shadow: 0 0 5px rgba(21,101,192,0.3);
        }

        /* 🔒 password */
        .password-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 14px;
            color: #1565c0;
        }

        /* ⚠ caps lock */
        .caps-warning {
            display: none;
            color: #b71c1c;
            font-size: 12px;
            margin-top: 5px;
        }

        .btn {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background-color: #1565c0;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            background-color: #0d47a1;
        }

        .footer-text {
            text-align: center;
            font-size: 12px;
            color: #666;
            padding: 15px;
            background: #f4f6f9;
        }

        .error {
            background-color: #ffcdd2;
            color: #b71c1c;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            .login-body { padding: 18px; }
            .btn { font-size: 15px; padding: 14px; }
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="login-header">
        <h2>CECUFID Morelia</h2>
        <small>Sistema de Control de Albercas</small>
    </div>

    <div class="login-body">

        {% if form.errors %}
            <div class="error">
                Usuario o contraseña incorrectos
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label>Usuario</label>
            {{ form.username }}

            <label>Contraseña</label>

            <div class="password-wrapper">
                {{ form.password }}
                <span class="toggle-password" onclick="togglePassword()">👁</span>
            </div>

            <div id="capsWarning" class="caps-warning">
                ⚠️ Bloq Mayús activado
            </div>

            <button type="submit" class="btn">Iniciar Sesión</button>
        </form>

    </div>

    <div class="footer-text">
        Gobierno del Estado de Michoacán • CECUFID
    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const passwordInput = document.querySelector('input[type="password"]');
    const capsWarning = document.getElementById("capsWarning");

    if (passwordInput) {
        passwordInput.addEventListener("keyup", function (e) {
            if (e.getModifierState && e.getModifierState("CapsLock")) {
                capsWarning.style.display = "block";
            } else {
                capsWarning.style.display = "none";
            }
        });
    }
});

function togglePassword() {
    const input = document.querySelector('input[type="password"]');
    if (!input) return;

    input.type = input.type === "password" ? "text" : "password";
}
</script>

</body>
</html>
