{% extends 'base.html' %}
{% block content %}
<h2>Producto</h2>

<form method="post">
    {% csrf_token %}

    <input type="text" name="nombre" placeholder="Nombre" value="{{ producto.nombre|default:'' }}">

    <input type="number" step="0.01" name="precio" placeholder="Precio" value="{{ producto.precio|default:'' }}">

    <input type="number" name="stock" placeholder="Stock" value="{{ producto.stock|default:'' }}">

    <label>
        Activo
        <input type="checkbox" name="activo" {% if producto.activo %}checked{% endif %}>
    </label>

    <button>Guardar</button>
</form>
{% endblock %}
