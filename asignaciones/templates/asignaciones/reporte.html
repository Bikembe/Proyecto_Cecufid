{% extends 'base.html' %}

{% block content %}

<style>
.table-box {
    background: white;
    padding: 15px;
    border-radius: 12px;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background: #1565c0;
    color: white;
    padding: 10px;
}

td {
    padding: 10px;
    border-bottom: 1px solid #ddd;
}
</style>

<h2>Reporte de Uso de Carriles</h2>

<div class="table-box">
<table>
    <tr>
        <th>Horario</th>
        <th>Ocupados</th>
        <th>Disponibles</th>
    </tr>

    {% for item in data %}
    <tr>
        <td>
            {{ item.horario.carril }} |
            {{ item.horario.hora_inicio }} - {{ item.horario.hora_fin }}
        </td>
        <td>{{ item.ocupados }}</td>
        <td>{{ item.disponibles }}</td>
    </tr>
    {% endfor %}
</table>
</div>

{% endblock %}
