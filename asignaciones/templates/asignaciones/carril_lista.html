{% extends 'base.html' %}

{% block content %}

<div class="card">

<h2>Lista de Carriles</h2>

<a class="btn" href="{% url 'asignaciones:carril_crear' %}">Nuevo Carril</a>

<br><br>

<div class="table-container">

<table>
    <tr>
        <th>Número</th>
        <th>Acciones</th>
    </tr>

    {% for c in carriles %}
    <tr>
        <td>{{ c.numero }}</td>
        <td>
            <a class="btn" href="{% url 'asignaciones:carril_editar' c.id %}">Editar</a>
            <a class="btn" href="{% url 'asignaciones:carril_eliminar' c.id %}">Eliminar</a>
        </td>
    </tr>
    {% endfor %}
</table>

</div>

</div>

{% endblock %}
