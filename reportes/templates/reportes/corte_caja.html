{% extends 'base.html' %}

{% block content %}
<h2>Corte de caja por usuario</h2>

<form method="get">
    <select name="usuario">
        <option value="">Todos</option>
        {% for u in usuarios %}
            <option value="{{ u.id }}" {% if usuario_id == u.id|stringformat:"s" %}selected{% endif %}>
                {{ u.username }}
            </option>
        {% endfor %}
    </select>

    <button type="submit">Filtrar</button>
</form>

<h3>Total: ${{ total }}</h3>

<table border="1">
<tr>
    <th>Fecha</th>
    <th>Tipo</th>
    <th>Monto</th>
</tr>

{% for p in pagos %}
<tr>
    <td>{{ p.fecha_pago }}</td>
    <td>{{ p.tipo_pago }}</td>
    <td>${{ p.monto }}</td>
</tr>
{% endfor %}
</table>
{% endblock %}
