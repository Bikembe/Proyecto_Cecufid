{% extends 'base.html' %}

{% block content %}

<style>
.form-box {
    background: rgba(255,255,255,0.95);
    padding: 20px;
    border-radius: 12px;
    max-width: 600px;
    margin: auto;
    box-shadow: 0 6px 18px rgba(0,0,0,0.15);
    backdrop-filter: blur(4px);
}

.form-box h2 {
    color: #0d47a1;
    margin-bottom: 10px;
}

.form-box p {
    color: #333;
    margin-bottom: 15px;
}

.form-box label {
    display: block;
    margin-top: 10px;
    margin-bottom: 5px;
    font-weight: 600;
    color: #0d47a1;
}

.form-box input,
.form-box textarea {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    outline: none;
    box-sizing: border-box;
}

.form-box input:focus,
.form-box textarea:focus {
    border-color: #1565c0;
    box-shadow: 0 0 0 3px rgba(21,101,192,0.15);
}

.btn {
    background: linear-gradient(135deg, #0d47a1, #1565c0);
    color: white;
    padding: 12px;
    width: 100%;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

.btn:hover {
    opacity: 0.9;
    transform: translateY(-1px);
}
</style>

<div class="form-box">

<h2>Evaluar nadador</h2>

<p><strong>Nadador:</strong> {{ inscripcion.nadador }}</p>

<form method="POST">
    {% csrf_token %}

    <label>Respiración</label>
    <input type="number" name="respiracion" min="0" max="10">

    <label>Libre</label>
    <input type="number" name="libre" min="0" max="10">

    <label>Espalda</label>
    <input type="number" name="espalda" min="0" max="10">

    <label>Mariposa</label>
    <input type="number" name="mariposa" min="0" max="10">

    <label>Resistencia</label>
    <input type="number" name="resistencia" min="0" max="10">

    <label>Observaciones</label>
    <textarea name="observaciones"></textarea>

    <button type="submit" class="btn">Guardar evaluación</button>
</form>

</div>

{% endblock %}
