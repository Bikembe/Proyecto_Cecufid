{% extends 'base.html' %}

{% block content %}

<style>
.form-box {
    background: white;
    padding: 20px;
    border-radius: 12px;
    max-width: 600px;
    margin: auto;
}

.form-box input, .form-box textarea {
    width: 100%;
    padding: 8px;
    margin-bottom: 10px;
}

.btn {
    background: #1565c0;
    color: white;
    padding: 10px;
    width: 100%;
    border: none;
}
</style>

<div class="form-box">

<h2>Evaluar nadador</h2>

<p><strong>Nadador:</strong> {{ inscripcion.nadador }}</p>

<form method="POST">
    {% csrf_token %}

    <label>Respiración</label>
    <input type="number" name="respiracion" min="0" max="10">

    <label>Libre</label>
    <input type="number" name="libre" min="0" max="10">

    <label>Espalda</label>
    <input type="number" name="espalda" min="0" max="10">

    <label>Mariposa</label>
    <input type="number" name="mariposa" min="0" max="10">

    <label>Resistencia</label>
    <input type="number" name="resistencia" min="0" max="10">

    <label>Observaciones</label>
    <textarea name="observaciones"></textarea>

    <button type="submit" class="btn">Guardar evaluación</button>
</form>

</div>

{% endblock %}
