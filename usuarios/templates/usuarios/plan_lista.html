{% extends 'base.html' %}
{% block content %}

<style>
.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.btn {
    background: #1565c0;
    color: white;
    padding: 10px 14px;
    border-radius: 6px;
    text-decoration: none;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.08);
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 700px;
}

th {
    background: #0d47a1;
    color: white;
    padding: 10px;
}

td {
    padding: 10px;
    border-bottom: 1px solid #eee;
}
</style>

<div class="top-bar">
    <h2>Planes de curso</h2>
    <a href="{% url 'usuarios:plan_crear' %}" class="btn">➕ Nuevo plan</a>
</div>

<div class="card">

<table border="1">
<tr>
    <th>Nombre</th>
    <th>Sede</th>
    <th>Categoría</th>
    <th>Tipo</th>
    <th>Precio</th>
    <th>Acciones</th>
</tr>

{% for p in planes %}
<tr>
    <td>{{ p.nombre }}</td>
    <td>{{ p.sede }}</td>
    <td>{{ p.categoria }}</td>
    <td>{{ p.tipo_curso }}</td>
    <td>{{ p.precio }}</td>
    <td>
        <a href="{% url 'usuarios:plan_editar' p.id %}">✏️</a>
        <a href="{% url 'usuarios:plan_eliminar' p.id %}">🗑</a>
    </td>
</tr>
{% endfor %}

</table>

</div>

{% endblock %}
