{% extends 'base.html' %}
{% block content %}

<style>
.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.btn {
    background: #1565c0;
    color: white;
    padding: 10px 14px;
    border-radius: 6px;
    text-decoration: none;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.08);
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 700px;
}

th {
    background: #0d47a1;
    color: white;
    padding: 10px;
}

td {
    padding: 10px;
    border-bottom: 1px solid #eee;
}

.acciones a {
    margin-right: 8px;
    text-decoration: none;
}

</style>

<div class="top-bar">
    <h2>Usuarios</h2>
    <a href="{% url 'usuario_crear' %}" class="btn">➕ Nuevo usuario</a>
</div>

<div class="card">

<table border="1">
<tr>
    <th>Nombre</th>
    <th>Email</th>
    <th>Rol</th>
    <th>Estado</th>
    <th>Acciones</th>
</tr>

{% for u in usuarios %}
<tr>
    <td>{{ u.first_name }} {{ u.last_name }}</td>
    <td>{{ u.email }}</td>
    <td>{{ u.rol }}</td>
    <td>{{ u.estado }}</td>
    <td class="acciones">
        <a href="{% url 'usuario_editar' u.id %}">✏️</a>
        <a href="{% url 'usuario_eliminar' u.id %}">🗑</a>
    </td>
</tr>
{% endfor %}

</table>

</div>

{% endblock %}
