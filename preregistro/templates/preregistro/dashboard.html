{% extends "base.html" %}
{% block content %}

<style>
.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.08);
    overflow-x: auto;
}

h2 {
    margin-bottom: 20px;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 400px;
}

th {
    background: #0d47a1;
    color: white;
    padding: 10px;
    text-align: left;
}

td {
    padding: 10px;
    border-bottom: 1px solid #eee;
}
</style>

<h2>Recepción - Pendientes</h2>

<div class="card">
<table>
<tr>
    <th>Nombre</th>
    <th>Estado</th>
</tr>

{% for r in pendientes %}
<tr>
    <td>{{ r.nombre }}</td>
    <td>{{ r.estado }}</td>
</tr>
{% empty %}
<tr>
    <td colspan="2">Sin registros</td>
</tr>
{% endfor %}

</table>
</div>

{% endblock %}
