{% extends "base.html" %}
{% block content %}

<style>
.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.08);
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 500px;
}

th {
    background: #0d47a1;
    color: white;
    padding: 10px;
}

td {
    padding: 10px;
    border-bottom: 1px solid #eee;
}
</style>

<h2>Lista de PreRegistros</h2>

<div class="card">
<table>
<tr>
    <th>ID</th>
    <th>Nombre</th>
    <th>Estado</th>
</tr>

{% for r in registros %}
<tr>
    <td>{{ r.id }}</td>
    <td>{{ r.nombre }}</td>
    <td>{{ r.estado }}</td>
</tr>
{% endfor %}

</table>
</div>

{% endblock %}
