{% extends "base.html" %}
{% block content %}

<h2>Lista de PreRegistros</h2>

<table border="1">
<tr>
    <th>ID</th>
    <th>Nombre</th>
    <th>Estado</th>
</tr>

{% for r in registros %}
<tr>
    <td>{{ r.id }}</td>
    <td>{{ r.nombre }}</td>
    <td>{{ r.estado }}</td>
</tr>
{% endfor %}

</table>

{% endblock %}
