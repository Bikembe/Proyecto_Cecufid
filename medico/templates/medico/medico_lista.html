{% extends 'base.html' %}

{% block content %}

<style>
.table-box {
    background: white;
    padding: 15px;
    border-radius: 12px;
    overflow-x: auto;
}

.btn {
    display: inline-block;
    background: #1565c0;
    color: white;
    padding: 8px 12px;
    border-radius: 6px;
    text-decoration: none;
    margin-bottom: 10px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background: #1565c0;
    color: white;
    padding: 10px;
}

td {
    padding: 10px;
    border-bottom: 1px solid #ddd;
}
</style>

<h2>Médicos</h2>

<a href="{% url 'medico:medico_crear' %}" class="btn">➕ Nuevo médico</a>

<div class="table-box">

<table>

    <tr>
        <th>Nombre</th>
        <th>Cédula</th>
        <th>Usuario</th>
        <th>Acciones</th>
    </tr>

    {% for m in medicos %}
    <tr>
        <td>{{ m.nombre_completo }}</td>
        <td>{{ m.cedula_profesional }}</td>
        <td>{{ m.usuario }}</td>
        <td>
            <a href="{% url 'medico:medico_editar' m.id %}">✏ Editar</a> |
            <a href="{% url 'medico:medico_eliminar' m.id %}">🗑 Eliminar</a>
        </td>
    </tr>
    {% endfor %}

</table>

</div>

{% endblock %}
